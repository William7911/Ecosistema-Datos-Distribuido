services:
  db:
    image: postgres:16
    container_name: postgres_local
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: proyecto_db
    ports:
      - "5432:5432"

  mongo:
    image: mongo:7.0
    container_name: mongo_local
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=admin123
    ports:
      - "27017:27017"
  
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql_local
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=PasswordFuerte2026!
    ports:
      - "1433:1433"

  oracle:
    image: gvenzl/oracle-free:slim
    container_name: oracle_local
    environment:
      - ORACLE_PASSWORD=PasswordFuerte2026!
    ports:
      - "1521:1521"